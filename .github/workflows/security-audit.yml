name: Security audit

# Weekly Claude audit of `dev` against docs/security/threat-model.md. Files issues, edits nothing.
# Requires the ANTHROPIC_API_KEY repository secret (API billing, not the Max seat).

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  id-token: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev
        # actions/checkout v4, pinned to a commit SHA to avoid mutable tag drift.
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: dev

      - name: Enable corepack
        run: corepack enable

      - name: Setup Node
        # actions/setup-node v4, pinned to a commit SHA to avoid mutable tag drift.
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Ensure labels exist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for label in security-audit critical high; do
            gh label create "$label" --force --color B60205 --description "Filed by the scheduled security audit" >/dev/null
          done

      - name: Run audit
        # anthropics/claude-code-action v1.0.234, pinned to a commit SHA to avoid mutable tag drift.
        uses: anthropics/claude-code-action@9171db3e57d6a3140a37ddc2ba92788584e0ead6
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: Follow the instructions in .github/prompts/security-audit.md exactly.
          claude_args: >-
            --model claude-opus-5-5
            --max-turns 80
            --allowedTools "Read,Grep,Glob,Bash(pnpm audit:*),Bash(gh issue list:*),Bash(gh issue create:*),Bash(git log:*),Bash(git diff:*)"
