name: Codex review

# Cross-vendor review: every PR gets a review from OpenAI Codex regardless of who wrote it.
# Requires the OPENAI_API_KEY repository secret. Runs only for same-repo branches so the
# secret is never exposed to forks.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: codex-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      # secrets are not readable in a job-level `if`, so gate the steps instead.
      HAS_OPENAI_KEY: ${{ secrets.OPENAI_API_KEY != '' }}
    steps:
      - name: Skip notice
        if: env.HAS_OPENAI_KEY != 'true'
        run: echo "::notice title=Codex review skipped::Set the OPENAI_API_KEY repository secret to enable the cross-vendor review."

      - name: Checkout merge commit
        if: env.HAS_OPENAI_KEY == 'true'
        # actions/checkout v4, pinned to a commit SHA to avoid mutable tag drift.
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          fetch-depth: 0

      - name: Fetch base and head refs
        if: env.HAS_OPENAI_KEY == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch --no-tags origin "$BASE_SHA" "$HEAD_SHA"
          git update-ref refs/remotes/origin/BASE "$BASE_SHA"
          git update-ref refs/remotes/origin/HEAD "$HEAD_SHA"

      - name: Write PR body for the reviewer
        if: env.HAS_OPENAI_KEY == 'true'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: printf '%s\n' "$PR_BODY" > PR_BODY.md

      - name: Run Codex review
        if: env.HAS_OPENAI_KEY == 'true'
        id: codex
        # openai/codex-action v1.12, pinned to a commit SHA to avoid mutable tag drift.
        uses: openai/codex-action@86365089eb2b84e0a8fb0717b304f8bdcb13b20e
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: .github/prompts/codex-review.md
          sandbox: read-only
          safety-strategy: drop-sudo
          output-file: codex-review.md

      - name: Post review comment
        if: env.HAS_OPENAI_KEY == 'true'
        # actions/github-script v8.0.0, pinned to a commit SHA to avoid mutable tag drift.
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          script: |
            const fs = require("fs");
            const marker = "<!-- codex-review -->";
            const body = `${marker}\n### Codex review (second vendor)\n\n${fs.readFileSync("codex-review.md", "utf8")}`;
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find((c) => c.body && c.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
