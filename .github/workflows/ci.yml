name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        # actions/checkout v4, pinned to a commit SHA to avoid mutable tag drift.
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Enable corepack
        run: corepack enable

      - name: Setup Node
        # actions/setup-node v4, pinned to a commit SHA to avoid mutable tag drift.
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        run: pnpm audit --prod

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test:run

      - name: Build
        run: pnpm build
