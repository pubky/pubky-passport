name: Build and Publish Docker Image

on:
  pull_request:
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/docker.yml"
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image (publish on release tags)
        uses: pubky/ci-workflows/.github/actions/docker/build_and_push@a57f2ae6382a8519ba4aa09d58b706f6b68a4426 # main
        with:
          registry: registry-1.docker.io/synonymsoft
          context: .
          push: ${{ github.event_name == 'push' }}
          latest: ${{ github.event_name == 'push' }}
          tags: |
            type=ref,event=tag
            type=ref,event=pr
          platforms: |
            linux/arm64
            linux/amd64
          image: pubky-passport
          cache_from: type=gha
          cache_to: type=gha,mode=max
