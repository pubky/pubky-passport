<text x="1140" y="188" font-size="18" font-weight="bold" fill="#4A2382" text-anchor="middle">Google module</text>
<text x="1140" y="209" font-size="15.5" fill="#4A2382" text-anchor="middle">sign-up check, backup</text>
<text x="1140" y="230" font-size="15.5" fill="#4A2382" text-anchor="middle">key</text>
