<rect width="1342" height="868" fill="#FFFFFF"/>
<text x="70" y="62" font-size="30" font-weight="bold" fill="#111">Homegate: an optional front door for any public homeserver</text>
<text x="70" y="98" font-size="18" fill="#555">Each module is switched on in the operator&#x27;s config. Passport reads one discovery endpoint and shows only what is on.</text>
