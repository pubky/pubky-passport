<text x="188" y="209" font-size="15.5" fill="#111111" text-anchor="middle">runs a homeserver, adds</text>
<text x="188" y="230" font-size="15.5" fill="#111111" text-anchor="middle">Homegate</text>
<rect x="70" y="416" width="236" height="86" rx="14" fill="#EAF7EE" stroke="#3FAE63" stroke-width="2.4"/>
<text x="188" y="454" font-size="18" font-weight="bold" fill="#185C2E" text-anchor="middle">Passport</text>
<text x="188" y="476" font-size="15.5" fill="#185C2E" text-anchor="middle">any instance</text>
<rect x="539" y="404" width="250" height="110" rx="14" fill="#F3EDFC" stroke="#9A6BE0" stroke-width="2.4"/>
<text x="664" y="444" font-size="18" font-weight="bold" fill="#4A2382" text-anchor="middle">Homegate</text>
<text x="664" y="465" font-size="15.5" fill="#4A2382" text-anchor="middle">discovery: methods,</text>
<text x="664" y="486" font-size="15.5" fill="#4A2382" text-anchor="middle">prices, storage, terms</text>
<rect x="1022" y="160" width="236" height="86" rx="14" fill="#F3EDFC" stroke="#9A6BE0" stroke-width="2.4"/>
<text x="1140" y="198" font-size="18" font-weight="bold" fill="#4A2382" text-anchor="middle">SSO module</text>
<text x="1140" y="220" font-size="15.5" fill="#4A2382" text-anchor="middle">Google, Apple</text>
<rect x="1022" y="288" width="236" height="86" rx="14" fill="#F3EDFC" stroke="#9A6BE0" stroke-width="2.4"/>
<text x="1140" y="326" font-size="18" font-weight="bold" fill="#4A2382" text-anchor="middle">SMS module</text>
<text x="1140" y="348" font-size="15.5" fill="#4A2382" text-anchor="middle">phone number</text>
<rect x="1022" y="416" width="236" height="86" rx="14" fill="#F3EDFC" stroke="#9A6BE0" stroke-width="2.4"/>
<text x="1140" y="444" font-size="18" font-weight="bold" fill="#4A2382" text-anchor="middle">Lightning module</text>
<text x="1140" y="465" font-size="15.5" fill="#4A2382" text-anchor="middle">pay to sign up or for</text>
<text x="1140" y="486" font-size="15.5" fill="#4A2382" text-anchor="middle">storage</text>
<rect x="1022" y="544" width="236" height="86" rx="14" fill="#F3EDFC" stroke="#9A6BE0" stroke-width="2.4"/>
<text x="1140" y="572" font-size="18" font-weight="bold" fill="#4A2382" text-anchor="middle">Invite code module</text>
<text x="1140" y="593" font-size="15.5" fill="#4A2382" text-anchor="middle">codes the operator hands</text>
<text x="1140" y="614" font-size="15.5" fill="#4A2382" text-anchor="middle">out</text>
<rect x="1022" y="672" width="236" height="86" rx="14" fill="#F3EDFC" stroke="#9A6BE0" stroke-width="2.4"/>
<text x="1140" y="710" font-size="18" font-weight="bold" fill="#4A2382" text-anchor="middle">Wrapping key module</text>
<text x="1140" y="732" font-size="15.5" fill="#4A2382" text-anchor="middle">unlocks SSO backups</text>
<rect x="546" y="672" width="236" height="86" rx="14" fill="#F1F2F4" stroke="#8A9099" stroke-width="2.4"/>
<text x="664" y="700" font-size="18" font-weight="bold" fill="#333A44" text-anchor="middle">Homeserver</text>
<text x="664" y="721" font-size="15.5" fill="#333A44" text-anchor="middle">admin API makes sign-up</text>
<text x="664" y="742" font-size="15.5" fill="#333A44" text-anchor="middle">tokens</text>
<rect x="454" y="172" width="61" height="25" rx="6" fill="#FFFFFF" opacity="0.92"/>
<text x="485" y="190" font-size="14.5" fill="#444" text-anchor="middle">config</text>
