<text x="1344" y="390" font-size="15.5" fill="#7E1F27" text-anchor="middle">encrypted backup</text>
<rect x="1226" y="480" width="236" height="86" rx="14" fill="#F3EDFC" stroke="#9A6BE0" stroke-width="2.4"/>
