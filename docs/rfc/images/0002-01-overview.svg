<text x="188" y="220" font-size="15.5" fill="#333A44" text-anchor="middle">e.g. pubky.app</text>
<rect x="410" y="160" width="236" height="86" rx="14" fill="#FFF3E6" stroke="#F0A040" stroke-width="2.4"/>
<text x="528" y="188" font-size="18" font-weight="bold" fill="#7A4A0C" text-anchor="middle">Dashboard</text>
<text x="528" y="209" font-size="15.5" fill="#7A4A0C" text-anchor="middle">one sign-in for the</text>
<text x="528" y="230" font-size="15.5" fill="#7A4A0C" text-anchor="middle">suite</text>
<rect x="70" y="400" width="236" height="86" rx="14" fill="#F1F2F4" stroke="#8A9099" stroke-width="2.4"/>
<text x="188" y="438" font-size="18" font-weight="bold" fill="#333A44" text-anchor="middle">External app</text>
<text x="188" y="460" font-size="15.5" fill="#333A44" text-anchor="middle">any developer</text>
<rect x="743" y="383" width="250" height="120" rx="14" fill="#EAF7EE" stroke="#3FAE63" stroke-width="2.4"/>
<text x="868" y="428" font-size="18" font-weight="bold" fill="#185C2E" text-anchor="middle">Account Vault</text>
<text x="868" y="449" font-size="15.5" fill="#185C2E" text-anchor="middle">key, sign-in, sign-up,</text>
<text x="868" y="470" font-size="15.5" fill="#185C2E" text-anchor="middle">every signature</text>
<rect x="750" y="640" width="236" height="86" rx="14" fill="#EAF2FE" stroke="#5B8DEF" stroke-width="2.4"/>
<text x="868" y="668" font-size="18" font-weight="bold" fill="#1D3F8A" text-anchor="middle">Accounts</text>
<text x="868" y="689" font-size="15.5" fill="#1D3F8A" text-anchor="middle">profile, files,</text>
<text x="868" y="710" font-size="15.5" fill="#1D3F8A" text-anchor="middle">homeserver tools</text>
<rect x="1226" y="160" width="236" height="86" rx="14" fill="#E6F7F7" stroke="#2AA6A6" stroke-width="2.4"/>
<text x="1344" y="188" font-size="18" font-weight="bold" fill="#0E5555" text-anchor="middle">Mobile Signer</text>
<text x="1344" y="209" font-size="15.5" fill="#0E5555" text-anchor="middle">Ring or Bitkit holds the</text>
<text x="1344" y="230" font-size="15.5" fill="#0E5555" text-anchor="middle">key</text>
<rect x="1226" y="320" width="236" height="86" rx="14" fill="#FDEDEE" stroke="#E06B74" stroke-width="2.4"/>
<text x="1344" y="348" font-size="18" font-weight="bold" fill="#7E1F27" text-anchor="middle">SSO provider</text>
