<rect width="1546" height="836" fill="#FFFFFF"/>
<text x="70" y="62" font-size="30" font-weight="bold" fill="#111">Overview: one codebase, two sites</text>
<text x="70" y="98" font-size="18" fill="#555">Apps link the Account Vault, which holds the key. Accounts manages your pubky with a grant. Anyone can run each part.</text>
