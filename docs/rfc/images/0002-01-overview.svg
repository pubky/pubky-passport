<text x="70" y="62" font-size="30" font-weight="bold" fill="#111">Overview: Passport in the middle</text>
<text x="70" y="98" font-size="18" fill="#555">Apps link Passport. Passport talks to the Mobile Signer, the SSO provider, a Homegate and the homeserver. Anyone can run each part.</text>
