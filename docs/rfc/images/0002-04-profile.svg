<text x="70" y="62" font-size="30" font-weight="bold" fill="#111">3. Profile creation and management</text>
<text x="70" y="98" font-size="18" fill="#555">The Account Vault writes the shared profile file at sign-up. Accounts edits it later. Every app reads the same file.</text>
