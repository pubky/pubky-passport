<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 860" width="2000" height="860" font-family="DejaVu Sans, Verdana, sans-serif">
<defs>
<marker id="dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker>
<marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2E9A50"/></marker>
<marker id="grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#888"/></marker>
<style>
.solid{stroke:#333;stroke-width:2.5;fill:none;marker-end:url(#dark)}
.dash{stroke:#2E9A50;stroke-width:2.5;fill:none;stroke-dasharray:8 6;marker-end:url(#green)}
.opt{stroke:#888;stroke-width:2.5;fill:none;stroke-dasharray:8 6;marker-end:url(#grey)}
.title{font-weight:bold;font-size:34px;fill:#111}
.h{font-weight:bold;font-size:26px;fill:#111}
.ct{font-weight:bold;font-size:21px;fill:#111}
.b{font-size:21px;fill:#222}
.cap{font-size:18px;fill:#555}
.el{font-size:18px;fill:#444}
.elb{font-size:18px;fill:#222;font-weight:bold}
.eg{font-size:18px;fill:#1E7D36;font-weight:bold}
.lg{font-size:20px;fill:#333}
.btn{font-size:20px;fill:#fff;font-weight:bold}
.mono{font-family:"DejaVu Sans Mono",monospace}
</style>
</defs>
<rect width="2000" height="860" fill="#fff"/>

<text x="56" y="62" class="title">What Passport can become (examples)</text>
<path class="solid" d="M1560,45 H1630"/>
<text x="1645" y="52" class="lg" text-anchor="start">signs in / uses</text>
<rect x="56" y="160" width="414" height="170" rx="14" fill="#EEF8F0" stroke="#2E9A50" stroke-width="3"/>
<text x="80" y="205" class="h" text-anchor="start">Passport identity</text>
<text x="80" y="245" class="b" text-anchor="start">SSO provider or</text>
<text x="80" y="277" class="b" text-anchor="start">imported key</text>
<rect x="56" y="430" width="414" height="210" rx="14" fill="#EDF3FF" stroke="#3B6FD9" stroke-width="3"/>
<text x="80" y="475" class="h" text-anchor="start">Key somewhere else</text>
<text x="80" y="515" class="b" text-anchor="start">Grant from Ring or Bitkit,</text>
<text x="80" y="547" class="b" text-anchor="start">or a child grant</text>
<text x="80" y="579" class="b" text-anchor="start">from Accounts</text>
<rect x="640" y="110" width="760" height="690" rx="14" fill="#EEF8F0" stroke="#2E9A50" stroke-width="3"/>
<text x="668" y="150" class="h" text-anchor="start">passport.pubky.app</text>
<rect x="668" y="180" width="332" height="100" rx="10" fill="#fff" stroke="#2E9A50" stroke-width="1.5"/>
<text x="688" y="220" class="ct" text-anchor="start">Onboarding for any app</text>
<text x="688" y="256" class="cap" text-anchor="start">Drop-in profile setup</text>
<rect x="1040" y="180" width="332" height="100" rx="10" fill="#fff" stroke="#2E9A50" stroke-width="1.5"/>
<text x="1060" y="220" class="ct" text-anchor="start">File explorer</text>
<text x="1060" y="256" class="cap" text-anchor="start">Browse homeserver files</text>
<rect x="668" y="300" width="332" height="100" rx="10" fill="#fff" stroke="#2E9A50" stroke-width="1.5"/>
<text x="688" y="340" class="ct" text-anchor="start">Backups and mirroring</text>
<text x="688" y="376" class="cap" text-anchor="start">Keep copies of your data</text>
<rect x="1040" y="300" width="332" height="100" rx="10" fill="#fff" stroke="#2E9A50" stroke-width="1.5"/>
<text x="1060" y="340" class="ct" text-anchor="start">Storage quota</text>
<text x="1060" y="376" class="cap" text-anchor="start">See how much space is used</text>
<rect x="668" y="420" width="332" height="100" rx="10" fill="#fff" stroke="#2E9A50" stroke-width="1.5"/>
<text x="688" y="460" class="ct" text-anchor="start">Homegate</text>
<text x="688" y="496" class="cap" text-anchor="start">Manage Homegate options</text>
<rect x="1040" y="420" width="332" height="100" rx="10" fill="#fff" stroke="#2E9A50" stroke-width="1.5"/>
<text x="1060" y="460" class="ct" text-anchor="start">Locked storage</text>
<text x="1060" y="496" class="cap" text-anchor="start">PIN, passkey, or biometrics</text>
<rect x="668" y="560" width="704" height="212" rx="10" fill="none" stroke="#2E9A50" stroke-width="1.5" stroke-dasharray="8 6"/>
<text x="690" y="598" font-weight="bold" font-size="22" fill="#1E7D36">Option: keep keys in this browser = off</text>
<text x="690" y="640" class="b" text-anchor="start">Passport works from a grant for everyday tasks</text>
<text x="690" y="674" class="b" text-anchor="start">and loads the key only when it needs to sign.</text>
<text x="690" y="716" class="cap" text-anchor="start">SSO identities only (they can reload the key</text>
<text x="690" y="744" class="cap" text-anchor="start">from their backup).</text>
<rect x="1540" y="230" width="404" height="150" rx="14" fill="#F2F2F2" stroke="#6E6E6E" stroke-width="3"/>
<text x="1564" y="275" class="h" text-anchor="start">Homeserver</text>
<text x="1564" y="315" class="b" text-anchor="start">Your data</text>
<rect x="1540" y="480" width="404" height="150" rx="14" fill="#F4EFFD" stroke="#7B4FD0" stroke-width="3"/>
<text x="1564" y="525" class="h" text-anchor="start">Homegate</text>
<text x="1564" y="565" class="b" text-anchor="start">Sign-up and options</text>
<path class="solid" d="M470,245 H638"/>
<text x="555" y="229" class="el" text-anchor="middle">sign in</text>
<path class="solid" d="M470,515 H638"/>
<text x="555" y="499" class="el" text-anchor="middle">grant</text>
<path class="solid" d="M1400,305 H1538"/>
<path class="solid" d="M1400,555 H1538"/>
</svg>