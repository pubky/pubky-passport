<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 1245" width="2000" height="1245" font-family="DejaVu Sans, Verdana, sans-serif">
<defs>
<marker id="dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker>
<marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2E9A50"/></marker>
<marker id="grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#888"/></marker>
<style>
.solid{stroke:#333;stroke-width:2.2;fill:none;marker-end:url(#dark)}
.dash{stroke:#2E9A50;stroke-width:2.2;fill:none;stroke-dasharray:8 6;marker-end:url(#green)}
.opt{stroke:#888;stroke-width:2.2;fill:none;stroke-dasharray:6 5;marker-end:url(#grey)}
.life{stroke:#bbb;stroke-width:1.5;stroke-dasharray:4 5}
.title{font-weight:bold;font-size:34px;fill:#111}
.sub{font-size:20px;fill:#555}
.sec{font-weight:bold;font-size:22px;fill:#111}
.h{font-weight:bold;font-size:20px;fill:#111}
.b{font-size:17px;fill:#222}
.cap{font-size:15px;fill:#555}
.lbl{font-size:16px;fill:#222;paint-order:stroke;stroke:#fff;stroke-width:6px;stroke-linejoin:round}
.lblg{font-size:16px;fill:#1E7D36;paint-order:stroke;stroke:#fff;stroke-width:6px;stroke-linejoin:round}
.num{font-weight:bold}
.link{font-size:15px;fill:#1E7D36;font-weight:bold}
.mono{font-family:"DejaVu Sans Mono",monospace}
.pro{font-size:17px;fill:#1E5E30}
.con{font-size:17px;fill:#8A2A1E}
</style>
</defs>
<rect width="2000" height="1245" fill="#fff"/>
<text x="56" y="62" class="title">Option A.1: Accounts redirects to Passport, Passport shows every option</text><text x="56" y="96" class="sub">Accounts has no sign-in page. Passport adds the Mobile Signer QR code.</text><text x="56" y="170" class="sec" text-anchor="start">What is passed where</text>
<line class="life" x1="200.0" y1="238" x2="200.0" y2="924"/>
<rect x="115.0" y="194" width="170.0" height="44" rx="10" fill="#EDF3FF" stroke="#3B6FD9" stroke-width="2"/>
<text x="200.0" y="222" class="b num" text-anchor="middle">App</text>
<line class="life" x1="600.0" y1="238" x2="600.0" y2="924"/>
<rect x="515.0" y="194" width="170.0" height="44" rx="10" fill="#FFF8EC" stroke="#D98A1C" stroke-width="2"/>
<text x="600.0" y="222" class="b num" text-anchor="middle">Accounts</text>
<line class="life" x1="1000.0" y1="238" x2="1000.0" y2="924"/>
<rect x="915.0" y="194" width="170.0" height="44" rx="10" fill="#EEF8F0" stroke="#2E9A50" stroke-width="2"/>
<text x="1000.0" y="222" class="b num" text-anchor="middle">Passport</text>
<line class="life" x1="1400.0" y1="238" x2="1400.0" y2="924"/>
<rect x="1315.0" y="194" width="170.0" height="44" rx="10" fill="#F2F2F2" stroke="#6E6E6E" stroke-width="2"/>
<text x="1400.0" y="222" class="b num" text-anchor="middle">Relay</text>
<line class="life" x1="1800.0" y1="238" x2="1800.0" y2="924"/>
<rect x="1715.0" y="194" width="170.0" height="44" rx="10" fill="#EDEDED" stroke="#222222" stroke-width="2"/>
<text x="1800.0" y="222" class="b num" text-anchor="middle">Mobile Signer</text>
<path class="solid" d="M200.0,278 H596.0"/>
<text x="214.0" y="269" class="lbl" text-anchor="start">1  Log in (redirect)</text>
<rect x="480.0" y="306" width="240.0" height="32" rx="6" fill="#FFFBE6" stroke="#E0C860" stroke-width="1.2"/>
<text x="600.0" y="327" class="cap" text-anchor="middle">saves the pending request</text>
<path class="solid" d="M600.0,378 H996.0"/>
<text x="614.0" y="369" class="lbl" text-anchor="start">2  redirect with the <tspan class="mono">pubkyauth://…</tspan> request</text>
<line x1="56" y1="422" x2="1920" y2="422" stroke="#ddd" stroke-width="1"/>
<rect x="56" y="406" width="153.4" height="30" rx="15" fill="#F4F4F4" stroke="#ccc" stroke-width="1"/>
<text x="68" y="426" class="cap num" text-anchor="start">SSO or import</text>
<path class="solid" d="M1000.0,478 H1396.0"/>
<text x="1014.0" y="469" class="lbl" text-anchor="start">3  signed parent grant, encrypted for Accounts</text>
<line x1="56" y1="522" x2="1920" y2="522" stroke="#ddd" stroke-width="1"/>
<rect x="56" y="506" width="153.4" height="30" rx="15" fill="#F4F4F4" stroke="#ccc" stroke-width="1"/>
<text x="68" y="526" class="cap num" text-anchor="start">Mobile Signer</text>
<path class="solid" d="M1800.0,578 H1404.0"/>
<text x="1414.0" y="569" class="lbl" text-anchor="start">3  signed parent grant</text>
<path class="opt" d="M1000.0,628 H1396.0"/>
<text x="1014.0" y="619" class="lbl" text-anchor="start">4  checks the channel, doesn't take it</text>
<line x1="56" y1="672" x2="1920" y2="672" stroke="#ddd" stroke-width="1"/>
<rect x="56" y="656" width="65.2" height="30" rx="15" fill="#F4F4F4" stroke="#ccc" stroke-width="1"/>
<text x="68" y="676" class="cap num" text-anchor="start">Both</text>
<path class="solid" d="M1000.0,728 H604.0"/>
<text x="614.0" y="719" class="lbl" text-anchor="start">5  redirect back (not a credential)</text>
<path class="dash" d="M1400.0,778 H604.0"/>
<text x="614.0" y="769" class="lblg" text-anchor="start">6  parent grant</text>
<path class="dash" d="M600.0,828 H204.0"/>
<text x="214.0" y="819" class="lblg" text-anchor="start">7  redirect back with a child grant</text>
<rect x="863.2" y="856" width="273.5999999999999" height="32" rx="6" fill="#FFFBE6" stroke="#E0C860" stroke-width="1.2"/>
<text x="1000.0" y="877" class="cap" text-anchor="middle">keeps the key and SSO account</text>
<rect x="56" y="964" width="934" height="241" rx="14" fill="#F3FAF5" stroke="#9CCFAA" stroke-width="1.5"/>
<text x="80" y="1008" class="sec" text-anchor="start">Benefits</text>
<text x="80" y="1044" class="pro" text-anchor="start">+ No new backend. Passport works as it does today.</text>
<text x="80" y="1075" class="pro" text-anchor="start">+ Keys and SSO sign-in stay on one site: one security review.</text>
<text x="80" y="1106" class="pro" text-anchor="start">+ No click before Passport opens, and every option is on one page.</text>
<text x="80" y="1137" class="pro" text-anchor="start">+ Accounts signs in like any app that uses Passport.</text>
<text x="80" y="1168" class="pro" text-anchor="start">+ Existing Passport users only approve.</text>
<rect x="1010" y="964" width="934" height="241" rx="14" fill="#FDF4F2" stroke="#E3A99F" stroke-width="1.5"/>
<text x="1034" y="1008" class="sec" text-anchor="start">Tradeoffs</text>
<text x="1034" y="1044" class="con" text-anchor="start">− One extra page change on the first sign-in.</text>
<text x="1034" y="1075" class="con" text-anchor="start">− Passport has to add the Mobile Signer QR code.</text>
<text x="1034" y="1106" class="con" text-anchor="start">− Mobile Signer users go through Passport without using its key.</text>
<text x="1034" y="1137" class="con" text-anchor="start">− The relay check needs a request with a relay secret on an inbox relay.</text></svg>