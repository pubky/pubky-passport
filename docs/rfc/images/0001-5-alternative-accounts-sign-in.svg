<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 960" width="2000" height="960" font-family="DejaVu Sans, Verdana, sans-serif">
<defs>
<marker id="dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker>
<marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2E9A50"/></marker>
<marker id="grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#888"/></marker>
<style>
.solid{stroke:#333;stroke-width:2.5;fill:none;marker-end:url(#dark)}
.dash{stroke:#2E9A50;stroke-width:2.5;fill:none;stroke-dasharray:8 6;marker-end:url(#green)}
.opt{stroke:#888;stroke-width:2.5;fill:none;stroke-dasharray:8 6;marker-end:url(#grey)}
.title{font-weight:bold;font-size:34px;fill:#111}
.h{font-weight:bold;font-size:26px;fill:#111}
.ct{font-weight:bold;font-size:21px;fill:#111}
.b{font-size:21px;fill:#222}
.cap{font-size:18px;fill:#555}
.el{font-size:18px;fill:#444}
.elb{font-size:18px;fill:#222;font-weight:bold}
.eg{font-size:18px;fill:#1E7D36;font-weight:bold}
.lg{font-size:20px;fill:#333}
.btn{font-size:20px;fill:#fff;font-weight:bold}
.mono{font-family:"DejaVu Sans Mono",monospace}
</style>
</defs>
<rect width="2000" height="960" fill="#fff"/>

<text x="56" y="62" class="title">Option: Accounts runs Google and Apple sign-in itself</text>
<path class="solid" d="M1330,45 H1400"/>
<text x="1415" y="52" class="lg" text-anchor="start">goes to / uses</text>
<path class="dash" d="M1633,45 H1703"/>
<text x="1718" y="52" class="lg" text-anchor="start">callback</text>
<rect x="56" y="220" width="344" height="210" rx="14" fill="#EDF3FF" stroke="#3B6FD9" stroke-width="3"/>
<text x="80" y="262" class="h" text-anchor="start">Pubky apps</text>
<text x="80" y="300" class="b" text-anchor="start">arena.pubky.app</text>
<text x="80" y="332" class="b" text-anchor="start">shop.pubky.app, …</text>
<rect x="80" y="360" width="124" height="38" rx="19" fill="#3B6ED8"/>
<text x="142" y="386" class="btn" text-anchor="middle">Log in</text>
<rect x="540" y="120" width="600" height="480" rx="14" fill="#FFF8EC" stroke="#D98A1C" stroke-width="3"/>
<text x="568" y="162" class="h" text-anchor="start">accounts.pubky.app</text>
<rect x="568" y="190" width="544" height="100" rx="10" fill="#fff" stroke="#D98A1C" stroke-width="1.5"/>
<text x="590" y="230" class="ct" text-anchor="start">Continue with Google or Apple</text>
<text x="590" y="266" class="cap" text-anchor="start">On the Accounts page, no redirect</text>
<rect x="568" y="310" width="544" height="110" rx="10" fill="#fff" stroke="#D98A1C" stroke-width="1.5"/>
<text x="590" y="350" class="ct" text-anchor="start">Key in memory</text>
<text x="590" y="386" class="cap" text-anchor="start">Signs the parent grant, then clears the key</text>
<rect x="568" y="440" width="544" height="120" rx="10" fill="#fff" stroke="#D98A1C" stroke-width="1.5"/>
<text x="590" y="480" class="ct" text-anchor="start">Child grants</text>
<text x="590" y="516" class="cap" text-anchor="start">Given to each suite app</text>
<rect x="540" y="700" width="600" height="200" rx="14" fill="#EEF8F0" stroke="#2E9A50" stroke-width="3"/>
<text x="568" y="742" class="h" text-anchor="start">passport.pubky.app</text>
<text x="568" y="782" class="b" text-anchor="start">Same Google and Apple sign-in code</text>
<text x="568" y="820" class="cap" text-anchor="start">Built and maintained twice.</text>
<text x="568" y="850" class="cap" text-anchor="start">Two sites handle private keys.</text>
<rect x="1320" y="120" width="624" height="780" rx="14" fill="#F2F2F2" stroke="#6E6E6E" stroke-width="3"/>
<text x="1344" y="162" class="h" text-anchor="start">Shared by both sites</text>
<rect x="1344" y="190" width="576" height="140" rx="10" fill="#fff" stroke="#6E6E6E" stroke-width="1.5"/>
<text x="1366" y="230" class="ct" text-anchor="start">Backend</text>
<text x="1366" y="266" class="cap" text-anchor="start">Homegate or a shared service</text>
<text x="1366" y="298" class="cap" text-anchor="start">Checks sign-in, returns the backup key</text>
<rect x="1344" y="350" width="576" height="140" rx="10" fill="#fff" stroke="#6E6E6E" stroke-width="1.5"/>
<text x="1366" y="390" class="ct" text-anchor="start">Same provider setup</text>
<text x="1366" y="426" class="cap" text-anchor="start">One Google client and Apple Services ID,</text>
<text x="1366" y="458" class="cap" text-anchor="start">so both sites reach the same backup</text>
<rect x="1344" y="510" width="576" height="110" rx="10" fill="#fff" stroke="#6E6E6E" stroke-width="1.5"/>
<text x="1366" y="550" class="ct" text-anchor="start">Google Drive or iCloud</text>
<text x="1366" y="586" class="cap" text-anchor="start">The encrypted backup</text>
<rect x="1344" y="640" width="576" height="110" rx="10" fill="none" stroke="#6E6E6E" stroke-width="1.5" stroke-dasharray="8 6"/>
<text x="1366" y="680" class="ct" text-anchor="start">Not tested yet</text>
<text x="1366" y="716" class="cap" text-anchor="start">Two sites reading the same backup</text>
<path class="solid" d="M400,300 H538"/>
<text x="470" y="284" class="el" text-anchor="middle">Log in</text>
<path class="dash" d="M540,380 H402"/>
<text x="470" y="410" class="eg" text-anchor="middle">child grant</text>
<path class="solid" d="M1140,360 H1318"/>
<text x="1229" y="344" class="el" text-anchor="middle">uses</text>
<path class="solid" d="M1140,820 H1318"/>
<text x="1229" y="804" class="el" text-anchor="middle">uses</text>
</svg>