<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 1222" width="2000" height="1222" font-family="DejaVu Sans, Verdana, sans-serif">
<defs>
<marker id="dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker>
<marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2E9A50"/></marker>
<marker id="grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#888"/></marker>
<style>
.solid{stroke:#333;stroke-width:2.5;fill:none;marker-end:url(#dark)}
.dash{stroke:#2E9A50;stroke-width:2.5;fill:none;stroke-dasharray:8 6;marker-end:url(#green)}
.opt{stroke:#888;stroke-width:2.5;fill:none;stroke-dasharray:8 6;marker-end:url(#grey)}
.title{font-weight:bold;font-size:34px;fill:#111}
.h{font-weight:bold;font-size:26px;fill:#111}
.ct{font-weight:bold;font-size:21px;fill:#111}
.b{font-size:21px;fill:#222}
.cap{font-size:18px;fill:#555}
.el{font-size:18px;fill:#444}
.elb{font-size:18px;fill:#222;font-weight:bold}
.eg{font-size:18px;fill:#1E7D36;font-weight:bold}
.lg{font-size:20px;fill:#333}
.btn{font-size:20px;fill:#fff;font-weight:bold}
.mono{font-family:"DejaVu Sans Mono",monospace}
</style>
</defs>
<rect width="2000" height="1222" fill="#fff"/>

<text x="56" y="62" class="title">Proposal: Passport handles every sign-in</text>
<path class="solid" d="M1330,45 H1400"/>
<text x="1415" y="52" class="lg" text-anchor="start">go to / auto redirect</text>
<path class="dash" d="M1717,45 H1787"/>
<text x="1802" y="52" class="lg" text-anchor="start">callback</text>
<rect x="56" y="153" width="388" height="124" rx="14" fill="#FFF8EC" stroke="#D98A1C" stroke-width="3"/>
<text x="80" y="198" class="h" text-anchor="start">accounts.pubky.app</text>
<text x="80" y="240" class="b" text-anchor="start">opened directly</text>
<rect x="56" y="389" width="388" height="194" rx="14" fill="#EDF3FF" stroke="#3B6FD9" stroke-width="3"/>
<text x="80" y="430" class="h" text-anchor="start">Pubky apps</text>
<text x="80" y="468" class="b" text-anchor="start">arena.pubky.app</text>
<text x="80" y="500" class="b" text-anchor="start">shop.pubky.app, …</text>
<rect x="80" y="525" width="124" height="38" rx="19" fill="#3B6ED8"/>
<text x="142" y="551" class="btn" text-anchor="middle">Log in</text>
<rect x="56" y="944" width="388" height="222" rx="14" fill="#F2F2F2" stroke="#6E6E6E" stroke-width="3"/>
<text x="80" y="985" class="h" text-anchor="start">External app</text>
<text x="80" y="1022" class="b" text-anchor="start">external.app</text>
<text x="80" y="1057" class="cap" text-anchor="start">Creates its own <tspan class="mono">pubkyauth://…</tspan></text>
<rect x="80" y="1097" width="124" height="38" rx="19" fill="#4A4A4A"/>
<text x="142" y="1123" class="btn" text-anchor="middle">Log in</text>
<rect x="583" y="111" width="583" height="777" rx="14" fill="#FFF8EC" stroke="#D98A1C" stroke-width="3"/>
<text x="611" y="150" class="h" text-anchor="start">accounts.pubky.app</text>
<rect x="611" y="178" width="533" height="99" rx="10" fill="#fff" stroke="#D98A1C" stroke-width="1.5"/>
<text x="634" y="213" font-weight="bold" font-size="22" fill="#A35F0A">Not signed in</text>
<text x="634" y="250" class="b" text-anchor="start">Creates a <tspan class="mono">pubkyauth://…</tspan> request</text>
<rect x="611" y="320" width="533" height="96" rx="10" fill="#fff" stroke="#D98A1C" stroke-width="1.5"/>
<text x="634" y="355" font-weight="bold" font-size="22" fill="#A35F0A">Already signed in</text>
<text x="634" y="392" class="b" text-anchor="start">One account. No Passport step.</text>
<rect x="611" y="528" width="533" height="332" rx="10" fill="#fff" stroke="#D98A1C" stroke-width="1.5"/>
<text x="634" y="563" font-weight="bold" font-size="22" fill="#A35F0A">After sign-in</text>
<text x="634" y="592" class="cap" text-anchor="start">signed grant from Passport, or already signed in</text>
<rect x="633" y="608" width="489" height="102" rx="8" fill="#EDF3FF"/>
<text x="655" y="645" class="ct" text-anchor="start">Came from a Pubky app</text>
<text x="655" y="682" class="b" text-anchor="start">Gets a child grant, back to the app</text>
<rect x="633" y="728" width="489" height="110" rx="8" fill="#FDF0DC"/>
<text x="655" y="765" class="ct" text-anchor="start">Opened accounts.pubky.app directly</text>
<text x="655" y="802" class="b" text-anchor="start">Overview of all Pubky apps</text>
<rect x="1333" y="111" width="611" height="694" rx="14" fill="#EEF8F0" stroke="#2E9A50" stroke-width="3"/>
<text x="1361" y="150" class="h" text-anchor="start">passport.pubky.app</text>
<rect x="1361" y="178" width="555" height="291" rx="10" fill="#fff" stroke="#2E9A50" stroke-width="1.5"/>
<text x="1384" y="213" font-weight="bold" font-size="22" fill="#1E7D36">Sign-in options</text>
<rect x="1383" y="233" width="511" height="97" rx="8" fill="#EEF8F0"/>
<text x="1405" y="270" class="ct" text-anchor="start">Mobile Signer QR code</text>
<text x="1405" y="307" class="b" text-anchor="start">Scan with Ring or Bitkit</text>
<rect x="1383" y="350" width="511" height="97" rx="8" fill="#EEF8F0"/>
<text x="1405" y="387" class="ct" text-anchor="start">Google, Apple, or Import</text>
<text x="1405" y="424" class="b" text-anchor="start">Key stays in this browser</text>
<rect x="1361" y="497" width="555" height="277" rx="10" fill="none" stroke="#2E9A50" stroke-width="1.5" stroke-dasharray="8 6"/>
<text x="1384" y="532" font-weight="bold" font-size="22" fill="#1E7D36">Later, for example:</text>
<text x="1385" y="570" class="b" text-anchor="start">• Profile and onboarding</text>
<text x="1385" y="607" class="b" text-anchor="start">• File explorer</text>
<text x="1385" y="644" class="b" text-anchor="start">• Backups and mirroring</text>
<text x="1385" y="681" class="b" text-anchor="start">• Storage quota</text>
<text x="1385" y="718" class="b" text-anchor="start">• Homegate</text>
<text x="1385" y="755" class="b" text-anchor="start">• …</text>
<path class="solid" d="M444,215 H581"/>
<path class="solid" d="M444,444 H581"/>
<text x="513" y="428" class="el" text-anchor="middle">Log in</text>
<path class="solid" d="M1144,227 H1331"/>
<text x="1250" y="211" class="elb" text-anchor="middle">auto redirect</text>
<path class="solid" d="M751,416 V526"/>
<text x="770" y="478" class="elb" text-anchor="start">auto redirect</text>
<path class="dash" d="M1333,652 H1146"/>
<text x="1250" y="636" class="eg" text-anchor="middle">signed</text>
<text x="1250" y="678" class="eg" text-anchor="middle">parent grant</text>
<path class="dash" d="M633,660 C560,655 530,565 446,553"/>
<text x="513" y="690" class="eg" text-anchor="middle">child grant</text>
<path class="solid" d="M444,1013 H1555 V807"/>
<text x="470" y="995" class="el" text-anchor="start">Log in goes straight to Passport with its <tspan class="mono">pubkyauth://…</tspan> request</text>
<path class="dash" d="M1777,805 V1110 H446"/>
<text x="470" y="1140" class="eg" text-anchor="start">signed grant, back to the external app</text>
</svg>