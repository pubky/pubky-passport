<text x="188" y="188" font-size="18" font-weight="bold" fill="#1D3F8A" text-anchor="middle">1 App</text>
<text x="188" y="209" font-size="15.5" fill="#1D3F8A" text-anchor="middle">Log in, then create a</text>
<text x="188" y="230" font-size="15.5" fill="#1D3F8A" text-anchor="middle">pubky</text>
<rect x="410" y="160" width="236" height="86" rx="14" fill="#EAF7EE" stroke="#3FAE63" stroke-width="2.4"/>
<text x="528" y="198" font-size="18" font-weight="bold" fill="#185C2E" text-anchor="middle">2 Passport</text>
<text x="528" y="220" font-size="15.5" fill="#185C2E" text-anchor="middle">pick a Homegate</text>
<rect x="750" y="160" width="236" height="86" rx="14" fill="#F3EDFC" stroke="#9A6BE0" stroke-width="2.4"/>
<text x="868" y="188" font-size="18" font-weight="bold" fill="#4A2382" text-anchor="middle">3 Homegate</text>
<text x="868" y="209" font-size="15.5" fill="#4A2382" text-anchor="middle">lists its methods and</text>
<text x="868" y="230" font-size="15.5" fill="#4A2382" text-anchor="middle">storage</text>
<rect x="1090" y="160" width="236" height="86" rx="14" fill="#EAF7EE" stroke="#3FAE63" stroke-width="2.4"/>
<text x="1208" y="188" font-size="18" font-weight="bold" fill="#185C2E" text-anchor="middle">4 Passport</text>
<text x="1208" y="209" font-size="15.5" fill="#185C2E" text-anchor="middle">verify: SSO, SMS,</text>
<text x="1208" y="230" font-size="15.5" fill="#185C2E" text-anchor="middle">Lightning, invite</text>
<rect x="1090" y="320" width="236" height="86" rx="14" fill="#F3EDFC" stroke="#9A6BE0" stroke-width="2.4"/>
<text x="1208" y="358" font-size="18" font-weight="bold" fill="#4A2382" text-anchor="middle">5 Homegate</text>
<text x="1208" y="380" font-size="15.5" fill="#4A2382" text-anchor="middle">returns a sign-up code</text>
<rect x="733" y="320" width="270" height="86" rx="43" fill="#FFFBE6" stroke="#D9B530" stroke-width="2.4"/>
<text x="868" y="358" font-size="18" font-weight="bold" fill="#5E4B00" text-anchor="middle">6 Where does the key</text>
<text x="868" y="380" font-size="18" font-weight="bold" fill="#5E4B00" text-anchor="middle">live?</text>
<rect x="410" y="320" width="236" height="86" rx="14" fill="#EAF7EE" stroke="#3FAE63" stroke-width="2.4"/>
<text x="528" y="348" font-size="18" font-weight="bold" fill="#185C2E" text-anchor="middle">7a Passport</text>
<text x="528" y="369" font-size="15.5" fill="#185C2E" text-anchor="middle">key in this browser,</text>
<text x="528" y="390" font-size="15.5" fill="#185C2E" text-anchor="middle">backup</text>
<rect x="750" y="480" width="236" height="86" rx="14" fill="#E6F7F7" stroke="#2AA6A6" stroke-width="2.4"/>
<text x="868" y="508" font-size="18" font-weight="bold" fill="#0E5555" text-anchor="middle">7b Mobile Signer</text>
<text x="868" y="529" font-size="15.5" fill="#0E5555" text-anchor="middle">scans a sign-up QR,</text>
<text x="868" y="550" font-size="15.5" fill="#0E5555" text-anchor="middle">makes the key</text>
<rect x="410" y="480" width="236" height="86" rx="14" fill="#F1F2F4" stroke="#8A9099" stroke-width="2.4"/>
<text x="528" y="508" font-size="18" font-weight="bold" fill="#333A44" text-anchor="middle">8 Homeserver</text>
<text x="528" y="529" font-size="15.5" fill="#333A44" text-anchor="middle">account created with the</text>
<text x="528" y="550" font-size="15.5" fill="#333A44" text-anchor="middle">code</text>
<rect x="70" y="480" width="236" height="86" rx="14" fill="#EAF7EE" stroke="#3FAE63" stroke-width="2.4"/>
<text x="188" y="508" font-size="18" font-weight="bold" fill="#185C2E" text-anchor="middle">9 Passport</text>
<text x="188" y="529" font-size="15.5" fill="#185C2E" text-anchor="middle">profile, then approve</text>
<text x="188" y="550" font-size="15.5" fill="#185C2E" text-anchor="middle">the app</text>
<rect x="659" y="153" width="78" height="44" rx="6" fill="#FFFFFF" opacity="0.92"/>
<text x="698" y="171" font-size="14.5" fill="#444" text-anchor="middle">which</text>
<text x="698" y="190" font-size="14.5" fill="#444" text-anchor="middle">methods?</text>
