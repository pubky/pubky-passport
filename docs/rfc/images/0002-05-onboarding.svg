<rect width="1430" height="676" fill="#FFFFFF"/>
<text x="70" y="62" font-size="30" font-weight="bold" fill="#111">4. Onboarding: Passport as the front end for Homegate</text>
<text x="70" y="98" font-size="18" fill="#555">You pick a Homegate. Passport reads which methods it offers, you verify, and the sign-up code creates the account where you</text>
<text x="70" y="122" font-size="18" fill="#555">chose to keep the key.</text>
