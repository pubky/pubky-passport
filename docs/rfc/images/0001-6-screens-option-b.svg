<text x="286" y="740" class="eg" text-anchor="middle">Already have a pubky? Import it</text>
<text x="286.0" y="870" class="ct" text-anchor="middle">Everything on the Accounts page</text>
<rect x="640" y="250" width="1304" height="390" rx="14" fill="#F2F2F2" stroke="#6E6E6E" stroke-width="3"/>
<text x="668" y="295" class="h" text-anchor="start">What happens behind the page</text>
<text x="668" y="350" class="b" text-anchor="start">1. Google or Apple opens in a pop-up from the click.</text>
<text x="668" y="406" class="b" text-anchor="start">2. Accounts sends the ID token to Homegate and gets the wrapping key.</text>
<text x="668" y="462" class="b" text-anchor="start">3. Accounts reads the encrypted backup and unlocks the key in memory.</text>
<text x="668" y="518" class="b" text-anchor="start">4. Accounts signs the parent grant, then clears the key.</text>
<text x="668" y="574" class="b" text-anchor="start">5. Mobile Signer: Accounts gets the parent grant from the relay.</text>
</svg>